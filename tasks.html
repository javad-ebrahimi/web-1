<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامه‌ریزی کارها</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-Digits/font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>

    <main class="main-content">
        
        <header class="page-header">
            <div>
                <h1>📋 برنامه‌ریزی کارها</h1>
                <p>کارهای خود را مدیریت کنید</p>
            </div>
            <button id="themeBtn" style="background:white; border:1px solid #e5e5ea; width:44px; height:44px; border-radius:50%; cursor:pointer; font-size:20px;">🌙</button>
        </header>

        <!-- کارت آمار (کشو) -->
        <div class="app-card" style="padding: 0; overflow: hidden;">
            <button class="stats-toggle" id="statsToggle" style="width: 100%; background: none; border: none; padding: 20px; display: flex; justify-content: space-between; font-family: inherit; font-weight: bold; font-size: 15px; color: #1d1d1f; cursor: pointer;">
                <span>📊 آمار و استریک</span>
                <span class="stats-arrow" id="statsArrow" style="transition: transform 0.3s;">▼</span>
            </button>
            <div class="stats-content" id="statsBody" style="max-height: 0; overflow: hidden; transition: all 0.3s; padding: 0 20px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px;"><span>امروز:</span> <strong id="todayStats">۰ از ۰</strong></div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px;"><span>🔥 استریک:</span> <strong id="streakStats">۰ روز</strong></div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 13px;"><span>📈 کل:</span> <strong id="totalStats">۰ کار</strong></div>
            </div>
        </div>

        <!-- کارت انتخاب روز (با ظاهر مرتب دو خطی) -->
        <div class="app-card" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;">
            <button id="prevDayBtn" class="btn-secondary" style="padding: 8px 16px;">▶ دیروز</button>
            
            <!-- تاریخ دو خطی -->
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
                <span id="dayPrefix" style="font-size: 11px; color: #86868b; font-weight: bold;">امروز</span>
                <span id="dateLabel" style="font-weight: 800; font-size: 15px; color: #1d1d1f;">در حال بارگذاری...</span>
            </div>

            <button id="nextDayBtn" class="btn-secondary" style="padding: 8px 16px;">فردا ◀</button>
        </div>

        <!-- کارت افزودن کار -->
        <div class="app-card">
            <div class="app-card-title">افزودن کار جدید</div>
            <input type="text" id="taskInput" placeholder="چه کاری داری؟">
            <div style="display: flex; gap: 10px;">
                <input type="time" id="timeInput" style="flex: 1;">
                <button id="addBtn" class="btn-primary" style="flex: 2;">+ افزودن</button>
            </div>
            <button id="recurringBtn" class="btn-secondary" style="width: 100%; margin-top: 10px;">🔁 تعریف کار تکراری</button>
        </div>

        <!-- کارت لیست کارها -->
        <div class="app-card">
            <div class="app-card-title">لیست کارها</div>
            <ul id="taskList" style="list-style: none; padding: 0; margin: 0;"></ul>
            <p id="counter" style="text-align: center; color: #86868b; font-size: 13px; margin-top: 15px;">۰ کار</p>
            <button id="reportBtn" class="btn-secondary" style="width: 100%; margin-top: 15px;">📊 مشاهده گزارش ماهانه</button>
        </div>

    </main>

    <!-- مودال‌ها -->
    <div class="modal" id="reportModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 style="font-size: 18px;">📊 گزارش ماهانه</h2>
                <button id="closeReportBtn" style="background:none; border:none; font-size:20px; cursor:pointer;">✕</button>
            </div>
            <div class="modal-body" id="reportBody"></div>
        </div>
    </div>

    <div class="modal" id="recurringModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 style="font-size: 18px;">🔁 تعریف کار تکراری</h2>
                <button id="closeRecurringBtn" style="background:none; border:none; font-size:20px; cursor:pointer;">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group"><label>عنوان کار *</label><input type="text" id="recTitle" placeholder="مثلاً: ورزش"></div>
                <div class="form-group"><label>ساعت (اختیاری)</label><input type="time" id="recTime"></div>
                <div class="form-group">
                    <label>نوع تکرار:</label>
                    <div class="radio-group" style="display: flex; flex-direction: column; gap: 8px; margin-top: 5px;">
                        <label><input type="radio" name="recType" value="range" checked> محدوده تاریخ</label>
                        <label><input type="radio" name="recType" value="weekdays"> روزهای هفته</label>
                        <label><input type="radio" name="recType" value="specific"> چند روز خاص</label>
                    </div>
                </div>
                <div id="recRangeSection" class="rec-section">
                    <div class="form-row" style="display: flex; gap: 10px;">
                        <div class="form-group" style="flex:1;"><label>از</label><input type="date" id="recStartDate"></div>
                        <div class="form-group" style="flex:1;"><label>تا</label><input type="date" id="recEndDate"></div>
                    </div>
                </div>
                <div id="recWeekdaysSection" class="rec-section" style="display:none;">
                    <div class="form-group"><label>روزها:</label>
                        <div class="weekdays-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
                            <label><input type="checkbox" class="weekday" value="6"> شنبه</label>
                            <label><input type="checkbox" class="weekday" value="0"> یکشنبه</label>
                            <label><input type="checkbox" class="weekday" value="1"> دوشنبه</label>
                            <label><input type="checkbox" class="weekday" value="2"> سه‌شنبه</label>
                            <label><input type="checkbox" class="weekday" value="3"> چهارشنبه</label>
                            <label><input type="checkbox" class="weekday" value="4"> پنجشنبه</label>
                            <label><input type="checkbox" class="weekday" value="5"> جمعه</label>
                        </div>
                    </div>
                    <div class="form-row" style="display: flex; gap: 10px;">
                        <div class="form-group" style="flex:1;"><label>از</label><input type="date" id="recWeekStart"></div>
                        <div class="form-group" style="flex:1;"><label>تا</label><input type="date" id="recWeekEnd"></div>
                    </div>
                </div>
                <div id="recSpecificSection" class="rec-section" style="display:none;">
                    <div class="form-group"><label>روزهای خاص:</label>
                        <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                            <input type="date" id="recSpecificDate">
                            <button type="button" id="addSpecificDateBtn" class="btn-primary" style="padding: 10px;">افزودن</button>
                        </div>
                        <ul id="specificDatesList" style="list-style: none; padding: 0;"></ul>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" id="recCancelBtn" class="btn-secondary" style="flex:1;">انصراف</button>
                    <button type="button" id="recSubmitBtn" class="btn-primary" style="flex:2;">ساخت کارها</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/tasks.js"></script>
</body>
</html>
