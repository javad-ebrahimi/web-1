<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سازنده QR Code</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-Digits/font-face.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/qrcode.css">
</head>
<body>

    <main class="main-content">
        
        <header class="page-header">
            <div>
                <h1>📱 QR Code</h1>
                <p>تبدیل لینک یا متن به QR</p>
            </div>
            <button id="themeBtn" style="background:white; border:1px solid #e5e5ea; width:44px; height:44px; border-radius:50%; cursor:pointer; font-size:20px;">🌙</button>
        </header>

        <!-- کارت ورودی -->
        <div class="app-card">
            <div class="app-card-title">متن یا لینک خود را وارد کنید</div>
            <textarea id="qrText" style="min-height: 100px; resize: vertical; direction: ltr;" placeholder="مثلاً: https://google.com"></textarea>
            <button id="generateQrBtn" class="btn-primary" style="width: 100%;">ساخت QR Code</button>
        </div>

        <!-- کارت نتیجه -->
        <div class="app-card" id="qrResultCard" style="display: none; text-align: center;">
            <div id="qrcode" style="display: flex; justify-content: center; margin-bottom: 20px; padding: 15px; background: white; border-radius: 12px;"></div>
            <button id="downloadQrBtn" class="btn-primary" style="width: 100%; background: #34c759;">📥 دانلود تصویر</button>
        </div>

    </main>

    <!-- کتابخانه ساخت QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script src="js/common.js"></script>
    <script src="js/qrcode.js"></script>
</body>
</html>
