<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت هزینه‌ها</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-Digits/font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/expenses.css">
</head>
<body>

    <main class="main-content">
        
        <header class="page-header">
            <div>
                <h1>💰 مدیریت هزینه‌ها</h1>
                <p id="dateLabel">امروز</p>
            </div>
            <button id="themeBtn" style="background:white; border:1px solid #e5e5ea; width:44px; height:44px; border-radius:50%; cursor:pointer; font-size:20px;">🌙</button>
        </header>

        <!-- کارت انتخاب روز -->
        <div class="app-card" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;">
            <button id="prevDayBtn" class="btn-secondary" style="padding: 8px 16px;">▶ دیروز</button>
            <span id="currentDateFull" style="font-weight: bold; font-size: 14px;">تاریخ</span>
            <button id="nextDayBtn" class="btn-secondary" style="padding: 8px 16px;">فردا ◀</button>
        </div>

        <!-- کارت افزودن هزینه -->
        <div class="app-card">
            <div class="app-card-title">ثبت هزینه جدید</div>
            <input type="text" id="expenseDesc" placeholder="توضیح (مثلاً: ناهار)">
            <div style="display: flex; gap: 10px;">
                <input type="text" id="expenseAmount" placeholder="مبلغ (تومان)" inputmode="numeric" style="flex: 1;">
                <button id="addExpenseBtn" class="btn-primary" style="flex: 1;">+ ثبت</button>
            </div>
        </div>

        <!-- کارت لیست هزینه‌های روز -->
        <div class="app-card">
            <div class="app-card-title">هزینه‌های این روز</div>
            <ul id="expenseList" style="list-style: none; padding: 0; margin: 0;"></ul>
            <div style="display: flex; justify-content: space-between; margin-top: 15px; padding-top: 15px; border-top: 1px solid #f0f0f0; font-weight: bold; color: #1d1d1f;">
                <span>جمع این روز:</span>
                <span id="expenseTotal" style="color: #34c759;">۰ تومان</span>
            </div>
        </div>

        <!-- کارت آمار ماه -->
        <div class="app-card">
            <div class="app-card-title">📊 آمار ماه</div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px;">
                <span style="color: #86868b;">جمع ماه:</span>
                <strong id="monthTotal" style="color: #1d1d1f;">۰ تومان</strong>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px;">
                <span style="color: #86868b;">تعداد هزینه‌ها:</span>
                <strong id="monthCount" style="color: #1d1d1f;">۰</strong>
            </div>
        </div>

        <!-- کارت نمودار -->
        <div class="app-card">
            <div class="app-card-title">📊 نمودار هزینه‌های ماه</div>
            <div style="position: relative; height: 250px; width: 100%;">
                <canvas id="expensesChart"></canvas>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/common.js"></script>
    <script src="js/expenses.js"></script>
</body>
</html>
