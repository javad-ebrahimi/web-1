<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تولید رمز عبور</title>
    <script>
        if (localStorage.getItem("theme") === "dark") {
            document.documentElement.style.background = "#1a1d29";
        }
    </script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/password.css">
    <link rel="stylesheet" href="css/dark.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-link">🏠 خانه</a>
        <a href="tasks.html" class="nav-link">📋 کارها</a>
        <a href="expenses.html" class="nav-link">💰 هزینه‌ها</a>
        <a href="calculator.html" class="nav-link">🧮 ماشین‌حساب</a>
        <a href="calendar.html" class="nav-link">📅 تقویم</a>
        <a href="password.html" class="nav-link active">🔐 رمز</a>
        <a href="memory.html" class="nav-link">🧠 حافظه</a>
        <a href="notes.html" class="nav-link">📝 یادداشت</a>
    </nav>

    <div class="app">
        <h1>🔐 تولید رمز عبور</h1>

        <button id="themeBtn" class="theme-btn" title="تغییر تم">🌙</button>

        <!-- نمایش رمز -->
        <div class="password-display">
            <span id="passwordOutput">-</span>
            <button id="copyBtn" class="copy-btn" title="کپی">📋</button>
        </div>

        <!-- قدرت رمز -->
        <div class="strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
        </div>
        <div class="strength-label" id="strengthLabel">قدرت رمز: -</div>

        <!-- تنظیمات -->
        <div class="password-options">
            <div class="option-group">
                <div class="option-header">
                    <label>طول رمز:</label>
                    <span class="option-value" id="lengthValue">16</span>
                </div>
                <input type="range" id="lengthInput" min="4" max="64" value="16">
            </div>

            <div class="option-checkboxes">
                <label class="option-checkbox">
                    <input type="checkbox" id="uppercase" checked>
                    <span>حروف بزرگ (A-Z)</span>
                </label>
                <label class="option-checkbox">
                    <input type="checkbox" id="lowercase" checked>
                    <span>حروف کوچک (a-z)</span>
                </label>
                <label class="option-checkbox">
                    <input type="checkbox" id="numbers" checked>
                    <span>اعداد (0-9)</span>
                </label>
                <label class="option-checkbox">
                    <input type="checkbox" id="symbols" checked>
                    <span>علائم (!@#$%)</span>
                </label>
            </div>

            <button id="generateBtn" class="generate-btn">🔄 تولید مجدد</button>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/password.js"></script>
</body>
</html>
