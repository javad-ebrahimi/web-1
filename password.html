<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تولید رمز</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-Digits/font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>

    <main class="main-content">
        
        <header class="page-header">
            <div>
                <h1>🔐 تولید رمز</h1>
                <p>رمزهای امن و تصادفی</p>
            </div>
            <button id="themeBtn" style="background:white; border:1px solid #e5e5ea; width:44px; height:44px; border-radius:50%; cursor:pointer; font-size:20px;">🌙</button>
        </header>

        <!-- ۱. نمایش رمز -->
        <div class="app-card" style="display: flex; justify-content: space-between; align-items: center; background: #f8f9fc; border: 2px dashed #0071e3; direction: ltr; padding: 25px;">
            <span id="passwordOutput" style="font-family: monospace; font-size: 22px; font-weight: bold; color: #1d1d1f; word-break: break-all; text-align: left; flex: 1;">-</span>
            <button id="copyBtn" class="btn-primary" style="padding: 10px 15px; margin-right: 15px;">📋 کپی</button>
        </div>

        <!-- ۲. بخش قدرت رمز (بالا، زیر نمایشگر) -->
        <div class="app-card" style="padding: 15px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; font-weight: bold;">
                <span>قدرت رمز:</span>
                <span id="strengthLabel">-</span>
            </div>
            <div style="background: #e5e5ea; height: 8px; border-radius: 4px; overflow: hidden;">
                <div id="strengthFill" style="height: 100%; width: 0%; border-radius: 4px; transition: all 0.3s;"></div>
            </div>
        </div>

        <!-- ۳. تنظیمات رمز -->
        <div class="app-card">
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <label style="margin: 0;">طول رمز:</label>
                    <span id="lengthValue" style="font-weight: bold; color: #0071e3;">16</span>
                </div>
                <input type="range" id="lengthInput" min="4" max="64" value="16" style="width: 100%; accent-color: #0071e3;">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;">
                <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer;">
                    <input type="checkbox" id="uppercase" checked style="width: 18px; height: 18px; accent-color: #0071e3; margin: 0;"> حروف بزرگ (A-Z)
                </label>
                <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer;">
                    <input type="checkbox" id="lowercase" checked style="width: 18px; height: 18px; accent-color: #0071e3; margin: 0;"> حروف کوچک (a-z)
                </label>
                <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer;">
                    <input type="checkbox" id="numbers" checked style="width: 18px; height: 18px; accent-color: #0071e3; margin: 0;"> اعداد (0-9)
                </label>
                <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer;">
                    <input type="checkbox" id="symbols" checked style="width: 18px; height: 18px; accent-color: #0071e3; margin: 0;"> علائم (!@#$)
                </label>
            </div>

            <button id="generateBtn" class="btn-primary" style="width: 100%; margin-top: 20px;">🔄 تولید مجدد</button>
        </div>

    </main>

    <script src="js/common.js"></script>
    <script src="js/password.js"></script>
</body>
</html>
