<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقویم</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-Digits/font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/calendar.css">
</head>
<body>

    <main class="main-content">
        
        <header class="page-header">
            <div>
                <h1>📅 تقویم</h1>
                <p id="dateLabel">نمای ماهانه</p>
            </div>
            <button id="themeBtn" style="background:white; border:1px solid #e5e5ea; width:44px; height:44px; border-radius:50%; cursor:pointer; font-size:20px;">🌙</button>
        </header>

        <!-- کارت تقویم -->
        <div class="app-card">
            <!-- هدر تقویم -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <button id="prevMonthBtn" class="btn-secondary" style="padding: 8px 16px;">◀</button>
                <div id="monthLabel" style="font-weight: 800; font-size: 16px; color: #1d1d1f;">-</div>
                <button id="nextMonthBtn" class="btn-secondary" style="padding: 8px 16px;">▶</button>
            </div>

            <!-- شبکه تقویم -->
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <!-- کارت اطلاعات روز -->
        <div class="app-card" id="dayInfo" style="min-height: 100px;">
            <div style="text-align: center; color: #aaa;">روزی را انتخاب کنید</div>
        </div>

    </main>

    <script src="js/common.js"></script>
    <script src="js/calendar.js"></script>
</body>
</html>
