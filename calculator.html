<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماشین‌حساب</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-Digits/font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/calculator.css">
</head>
<body>

    <main class="main-content">
        
        <header class="page-header">
            <div>
                <h1>🧮 ماشین‌حساب</h1>
                <p>محاسبات سریع</p>
            </div>
            <button id="themeBtn" style="background:white; border:1px solid #e5e5ea; width:44px; height:44px; border-radius:50%; cursor:pointer; font-size:20px;">🌙</button>
        </header>

        <div class="app-card">
            <!-- نمایشگر -->
            <div class="calc-display-box">
                <div class="calc-history" id="calcHistory"></div>
                <div class="calc-result" id="calcDisplay">0</div>
            </div>

            <!-- دکمه‌ها -->
            <div class="calc-keys">
                <button class="calc-btn calc-clear" data-action="clear">C</button>
                <button class="calc-btn calc-action" data-action="sign">±</button>
                <button class="calc-btn calc-action" data-action="percent">%</button>
                <button class="calc-btn calc-operator" data-op="÷">÷</button>

                <button class="calc-btn calc-num" data-num="7">7</button>
                <button class="calc-btn calc-num" data-num="8">8</button>
                <button class="calc-btn calc-num" data-num="9">9</button>
                <button class="calc-btn calc-operator" data-op="×">×</button>

                <button class="calc-btn calc-num" data-num="4">4</button>
                <button class="calc-btn calc-num" data-num="5">5</button>
                <button class="calc-btn calc-num" data-num="6">6</button>
                <button class="calc-btn calc-operator" data-op="−">−</button>

                <button class="calc-btn calc-num" data-num="1">1</button>
                <button class="calc-btn calc-num" data-num="2">2</button>
                <button class="calc-btn calc-num" data-num="3">3</button>
                <button class="calc-btn calc-operator" data-op="+">+</button>

                <button class="calc-btn calc-num" data-num="0" style="grid-column: span 2;">0</button>
                <button class="calc-btn calc-num" data-num=".">.</button>
                <button class="calc-btn calc-equals" data-action="equals">=</button>
            </div>
        </div>

    </main>

    <script src="js/common.js"></script>
    <script src="js/calculator.js"></script>
</body>
</html>
