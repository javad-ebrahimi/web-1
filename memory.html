<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی حافظه</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-Digits/font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/memory.css">
</head>
<body>

    <main class="main-content">
        
        <header class="page-header">
            <div>
                <h1>🧠 بازی حافظه</h1>
                <p>جفت‌های همسان را پیدا کن</p>
            </div>
            <button id="themeBtn" style="background:white; border:1px solid #e5e5ea; width:44px; height:44px; border-radius:50%; cursor:pointer; font-size:20px;">🌙</button>
        </header>

        <!-- آمار بازی -->
        <div class="memory-stats-grid">
            <div class="app-card memory-stat">
                <span class="memory-stat-label">حرکات</span>
                <h2 id="movesCount" class="memory-stat-value">۰</h2>
            </div>
            <div class="app-card memory-stat">
                <span class="memory-stat-label">زمان</span>
                <h2 id="timer" class="memory-stat-value">۰۰:۰۰</h2>
            </div>
            <div class="app-card memory-stat">
                <span class="memory-stat-label">بهترین</span>
                <h2 id="bestScore" class="memory-stat-value" style="color: #ff9500;">-</h2>
            </div>
        </div>

        <!-- صفحه بازی -->
        <div class="app-card">
            <div class="memory-board" id="memoryBoard"></div>
            <button id="newGameBtn" class="btn-primary" style="width: 100%; margin-top: 20px;">🔄 بازی جدید</button>
        </div>

        <!-- پیام برد -->
        <div class="win-message" id="winMessage">
            <div class="win-icon">🎉</div>
            <h2 class="win-title">آفرین!</h2>
            <p id="winText" class="win-text">بازی رو تموم کردی!</p>
            <button id="playAgainBtn" class="btn-primary" style="margin-top: 10px;">بازی مجدد</button>
        </div>

    </main>

    <script src="js/common.js"></script>
    <script src="js/memory.js"></script>
</body>
</html>
