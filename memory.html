<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی حافظه</title>
    <script>
        if (localStorage.getItem("theme") === "dark") {
            document.documentElement.style.background = "#1a1d29";
        }
    </script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/memory.css">
    <link rel="stylesheet" href="css/dark.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-link">🏠 خانه</a>
        <a href="tasks.html" class="nav-link">📋 کارها</a>
        <a href="expenses.html" class="nav-link">💰 هزینه‌ها</a>
        <a href="calculator.html" class="nav-link">🧮 ماشین‌حساب</a>
        <a href="calendar.html" class="nav-link">📅 تقویم</a>
        <a href="password.html" class="nav-link">🔐 رمز</a>
        <a href="memory.html" class="nav-link active">🧠 حافظه</a>
        <a href="notes.html" class="nav-link">📝 یادداشت</a>
    </nav>

    <div class="app">
        <h1>🧠 بازی حافظه</h1>

        <button id="themeBtn" class="theme-btn" title="تغییر تم">🌙</button>

        <!-- آمار بازی -->
        <div class="memory-stats">
            <div class="memory-stat">
                <span class="memory-stat-label">حرکات</span>
                <span class="memory-stat-value" id="movesCount">۰</span>
            </div>
            <div class="memory-stat">
                <span class="memory-stat-label">زمان</span>
                <span class="memory-stat-value" id="timer">۰۰:۰۰</span>
            </div>
            <div class="memory-stat">
                <span class="memory-stat-label">بهترین</span>
                <span class="memory-stat-value" id="bestScore">-</span>
            </div>
        </div>

        <!-- صفحه بازی -->
        <div class="memory-board" id="memoryBoard"></div>

        <!-- پیام برد -->
        <div class="win-message" id="winMessage">
            <div class="win-icon">🎉</div>
            <h2>آفرین!</h2>
            <p id="winText">بازی رو تموم کردی!</p>
            <button id="playAgainBtn" class="play-again-btn">بازی مجدد</button>
        </div>

        <!-- دکمه بازی جدید -->
        <button id="newGameBtn" class="new-game-btn">🔄 بازی جدید</button>
    </div>

    <script src="js/common.js"></script>
    <script src="js/memory.js"></script>
</body>
</html>
