<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی حافظه</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-Digits/font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/memory.css">
</head>
<body>

    <main class="main-content">
        
        <header class="page-header">
            <div>
                <h1>🧠 بازی حافظه</h1>
                <p>جفت‌های همسان را پیدا کن</p>
            </div>
            <button id="themeBtn" style="background:white; border:1px solid #e5e5ea; width:44px; height:44px; border-radius:50%; cursor:pointer; font-size:20px;">🌙</button>
        </header>

        <!-- آمار بازی -->
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px;">
            <div class="app-card" style="text-align: center; padding: 15px; margin-bottom: 0;">
                <span style="font-size: 12px; color: #86868b;">حرکات</span>
                <h2 id="movesCount" style="font-size: 20px; color: #1d1d1f; margin-top: 5px;">۰</h2>
            </div>
            <div class="app-card" style="text-align: center; padding: 15px; margin-bottom: 0;">
                <span style="font-size: 12px; color: #86868b;">زمان</span>
                <h2 id="timer" style="font-size: 20px; color: #1d1d1f; margin-top: 5px;">۰۰:۰۰</h2>
            </div>
            <div class="app-card" style="text-align: center; padding: 15px; margin-bottom: 0;">
                <span style="font-size: 12px; color: #86868b;">بهترین</span>
                <h2 id="bestScore" style="font-size: 20px; color: #ff9500; margin-top: 5px;">-</h2>
            </div>
        </div>

        <!-- صفحه بازی -->
        <div class="app-card">
            <div class="memory-board" id="memoryBoard"></div>
            <button id="newGameBtn" class="btn-primary" style="width: 100%; margin-top: 20px;">🔄 بازی جدید</button>
        </div>

        <!-- پیام برد -->
        <div class="win-message" id="winMessage" style="display: none; text-align: center; padding: 30px; background: #e8f8ed; border-radius: 20px; border: 1px solid #34c759; margin-top: 20px;">
            <div style="font-size: 50px; margin-bottom: 10px;">🎉</div>
            <h2 style="color: #1d1d1f;">آفرین!</h2>
            <p id="winText" style="color: #555; margin: 10px 0 20px 0;">بازی رو تموم کردی!</p>
            <button id="playAgainBtn" class="btn-primary">بازی مجدد</button>
        </div>

    </main>

    <script src="js/common.js"></script>
    <script src="js/memory.js"></script>
</body>
</html>
