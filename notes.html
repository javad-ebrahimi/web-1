<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>یادداشت‌ها</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-Digits/font-face.css" rel="stylesheet">
    
    <!-- فایل مادر -->
    <link rel="stylesheet" href="css/theme.css">
    
    <!-- فایل اختصاصی یادداشت‌ها -->
    <link rel="stylesheet" href="css/notes.css">
</head>
<body>

    <main class="main-content">
        
        <header class="page-header">
            <div>
                <h1>📝 یادداشت‌های من</h1>
                <p>ایده‌ها و نکته‌ها</p>
            </div>
            <button id="themeBtn" style="background:white; border:1px solid #e5e5ea; width:44px; height:44px; border-radius:50%; cursor:pointer; font-size:20px;">🌙</button>
        </header>

        <!-- دکمه افزودن -->
        <button id="addNoteBtn" class="btn-primary" style="width: 100%; margin-bottom: 20px;">+ یادداشت جدید</button>

        <!-- لیست یادداشت‌ها -->
        <div id="notesList" style="display: flex; flex-direction: column;"></div>

        <!-- حالت خالی -->
        <div id="emptyState" class="app-card" style="display:none; text-align: center; padding: 40px;">
            <div style="font-size: 40px; opacity: 0.5; margin-bottom: 10px;">📝</div>
            <p style="color: #86868b;">هنوز یادداشتی نداری.</p>
        </div>

    </main>

    <!-- مودال ویرایش/افزودن -->
    <div class="modal" id="noteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle" style="font-size: 18px;">یادداشت جدید</h2>
                <button id="closeModalBtn" style="background:none; border:none; font-size:20px; cursor:pointer;">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>عنوان</label>
                    <input type="text" id="noteTitle" placeholder="مثلاً: ایده برای پروژه">
                </div>
                <div class="form-group">
                    <label>متن یادداشت</label>
                    <textarea id="noteContent" placeholder="هرچی می‌خوای بنویس..." style="min-height: 120px; resize: vertical;"></textarea>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" id="cancelNoteBtn" class="btn-secondary" style="flex: 1;">انصراف</button>
                    <button type="button" id="saveNoteBtn" class="btn-primary" style="flex: 2;">ذخیره</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/notes.js"></script>
</body>
</html>
